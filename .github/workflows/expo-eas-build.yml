name: BUILD - EXPO - EAS
on:
  workflow_call:
    inputs:
      profile:
        description: 'EAS build profile from eas.json'
        required: false
        type: string
        default: 'development'
      platform:
        description: 'android or ios'
        required: false
        type: string
        default: 'android'
    secrets:
      expo_token:
        required: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          patch-watchers: false
          token: ${{ secrets.expo_token }}
      - name: Build on EAS
        env:
          PROFILE: ${{ inputs.profile }}
          PLATFORM: ${{ inputs.platform }}
        run: eas build --profile "$PROFILE" --platform "$PLATFORM" --non-interactive --json > build.json
      - name: Show the download link
        run: |
          url=$(node -p "JSON.parse(require('fs').readFileSync('build.json','utf8'))[0].artifacts.buildUrl")
          {
            echo "## EAS build (${{ inputs.profile }}, ${{ inputs.platform }})"
            echo
            echo "[Download the build]($url)"
          } >> "$GITHUB_STEP_SUMMARY"
