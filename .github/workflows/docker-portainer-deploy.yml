name: DEPLOY - DOCKER - PORTAINER
on:
  workflow_call:
    inputs:
      image:
        description: 'Docker Hub image without tag (user/name)'
        required: true
        type: string
      dockerfile_dir:
        description: 'Build context'
        required: false
        type: string
        default: '.'
      dockerfile_name:
        description: 'Dockerfile name'
        required: false
        type: string
        default: 'Dockerfile'
      dockerfile_target:
        description: 'Dockerfile target'
        required: false
        type: string
        default: 'prod'
      build_args:
        description: 'Build arguments, one KEY=VALUE per line'
        required: false
        type: string
        default: ''
      rollback_tag:
        description: 'Earlier tag to redeploy; empty builds the current commit'
        required: false
        type: string
        default: ''
      health_url:
        description: 'URL polled until it answers 200; empty skips the check'
        required: false
        type: string
        default: ''
      portainer_stack:
        description: 'Name of the Portainer stack to redeploy through the API; used when no webhook URL is given'
        required: false
        type: string
        default: ''
      portainer_insecure:
        description: 'Accept a self-signed certificate on the Portainer URL'
        required: false
        type: boolean
        default: false
    secrets:
      docker_hub_username:
        required: true
      docker_hub_access_token:
        required: true
      portainer_webhook_url:
        description: 'Stack webhook (Portainer Business); empty uses the API'
        required: false
      portainer_url:
        description: 'Portainer base URL, e.g. https://203.0.113.10:9443, for the API'
        required: false
      portainer_api_key:
        description: 'Portainer access token (My account, Access tokens), for the API'
        required: false
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.docker_hub_username }}
          password: ${{ secrets.docker_hub_access_token }}
      - name: Compute the release tag
        id: tag
        run: |
          if [ -n "${{ inputs.rollback_tag }}" ]; then
            echo "value=${{ inputs.rollback_tag }}" >> "$GITHUB_OUTPUT"
          else
            today=$(date -u +%Y-%m-%d)
            count=$(git tag --list "deploy-${today}.*" | wc -l)
            echo "value=deploy-${today}.$((count + 1))" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Docker Buildx
        if: inputs.rollback_tag == ''
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        if: inputs.rollback_tag == ''
        uses: docker/build-push-action@v6
        with:
          push: true
          context: ${{ inputs.dockerfile_dir }}
          file: ${{ inputs.dockerfile_dir }}/${{ inputs.dockerfile_name }}
          target: ${{ inputs.dockerfile_target }}
          build-args: ${{ inputs.build_args }}
          tags: |
            ${{ inputs.image }}:${{ steps.tag.outputs.value }}
            ${{ inputs.image }}:latest
      - name: Roll back to an earlier image
        if: inputs.rollback_tag != ''
        run: |
          docker buildx imagetools create \
            --tag "${{ inputs.image }}:latest" \
            "${{ inputs.image }}:${{ inputs.rollback_tag }}"
      - name: Update the stack in Portainer
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.portainer_webhook_url }}
          PORTAINER_URL: ${{ secrets.portainer_url }}
          PORTAINER_API_KEY: ${{ secrets.portainer_api_key }}
          PORTAINER_STACK: ${{ inputs.portainer_stack }}
          PORTAINER_INSECURE: ${{ inputs.portainer_insecure && '1' || '' }}
        run: |
          set -euo pipefail
          if [ -n "$PORTAINER_WEBHOOK_URL" ]; then
            curl --fail --silent --show-error --max-time 60 -X POST "$PORTAINER_WEBHOOK_URL"
            exit 0
          fi
          if [ -z "$PORTAINER_URL" ] || [ -z "$PORTAINER_API_KEY" ] || [ -z "$PORTAINER_STACK" ]; then
            echo "set the portainer_webhook_url secret, or the portainer_url and portainer_api_key secrets with the portainer_stack input" >&2
            exit 1
          fi
          api="${PORTAINER_URL%/}/api"
          curl_api() {
            curl --fail-with-body --silent --show-error --max-time 300 ${PORTAINER_INSECURE:+--insecure} \
              -H "X-API-Key: ${PORTAINER_API_KEY}" "$@"
          }
          stacks=$(curl_api "$api/stacks")
          stack=$(jq -c --arg name "$PORTAINER_STACK" '[.[] | select(.Name == $name)] | first // empty' <<<"$stacks")
          if [ -z "$stack" ]; then
            echo "no Portainer stack named $PORTAINER_STACK" >&2
            exit 1
          fi
          id=$(jq -r '.Id' <<<"$stack")
          endpoint=$(jq -r '.EndpointId' <<<"$stack")
          file=$(curl_api "$api/stacks/$id/file" | jq -r '.StackFileContent')
          jq -n --arg file "$file" --argjson env "$(jq -c '.Env // []' <<<"$stack")" \
            '{stackFileContent: $file, env: $env, prune: false, pullImage: true}' \
            | curl_api -X PUT "$api/stacks/$id?endpointId=$endpoint" -H 'Content-Type: application/json' --data-binary @- \
            | jq -r '"stack \(.Name) (id \(.Id)) redeployed with the latest image"'
      - name: Wait for the application
        if: inputs.health_url != ''
        run: |
          for attempt in $(seq 1 30); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 "${{ inputs.health_url }}" || true)
            if [ "$status" = "200" ]; then
              echo "healthy after attempt $attempt"
              exit 0
            fi
            sleep 10
          done
          echo "no 200 from ${{ inputs.health_url }} after 5 minutes"
          exit 1
      - name: Tag the commit and publish the release
        if: inputs.rollback_tag == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "${{ steps.tag.outputs.value }}"
          git push origin "${{ steps.tag.outputs.value }}"
          gh release create "${{ steps.tag.outputs.value }}" --generate-notes
